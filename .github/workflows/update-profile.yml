name: Update profile cards

on:
  schedule:
    - cron: "17 6 * * *"        # daily, 06:17 UTC (~00:17 Mexico City)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - ascii.json
      - build_svg.py
      - update_stats.py

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch live stats -> stats.json
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
          LOC_AFFILIATIONS: OWNER   # add COLLABORATOR,ORGANIZATION_MEMBER to also count work repos
        run: python update_stats.py

      - name: Render the SVG cards
        run: python build_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
